
name: Update Naver Blog RSS

on:
  schedule:
    - cron: "10 6 * * *"
      timezone: "Asia/Seoul"
    - cron: "10 12 * * *"
      timezone: "Asia/Seoul"
    - cron: "10 18 * * *"
      timezone: "Asia/Seoul"
    - cron: "10 23 * * *"
      timezone: "Asia/Seoul"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Naver RSS and create JSON
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import os
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          BLOGS = [
              {
                  "name": "서울참정형외과",
                  "url": "https://rss.blog.naver.com/seoulcharm1.xml"
              },
              {
                  "name": "호호척추관절",
                  "url": "https://rss.blog.naver.com/hohospine.xml"
              }
          ]

          OUTPUT = "blog/blog.json"
          items = []

          def fetch_blog(blog):
              print(f"{blog['name']} RSS 가져오는 중...")

              req = urllib.request.Request(
                  blog["url"],
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  xml_data = response.read()

              root = ET.fromstring(xml_data)
              blog_items = []

              for item in root.findall(".//item")[:9]:

                  def text(tag):
                      element = item.find(tag)
                      return element.text.strip() if element is not None and element.text else ""

                  title = text("title")
                  link = text("link")
                  description = text("description")
                  pub_date = text("pubDate")

                  thumbnail = ""

                  match = re.search(
                      r'<img[^>]+src=["\']([^"\']+)["\']',
                      description,
                      re.IGNORECASE
                  )

                  if match:
                      thumbnail = match.group(1)

                  blog_items.append({
                      "title": title,
                      "link": link,
                      "description": description,
                      "pubDate": pub_date,
                      "thumbnail": thumbnail,
                      "blogName": blog["name"]
                  })

              if not blog_items:
                  raise RuntimeError(
                      f"{blog['name']} RSS에서 게시글을 찾지 못했습니다."
                  )

              print(f"{blog['name']}: {len(blog_items)}개 수집")
              return blog_items

          # 두 블로그의 게시글 수집
          for blog in BLOGS:
              items.extend(fetch_blog(blog))

          # 게시 날짜를 기준으로 최신순 정렬
          def sort_date(item):
              try:
                  return parsedate_to_datetime(
                      item["pubDate"]
                  ).timestamp()
              except Exception:
                  return 0

          items.sort(key=sort_date, reverse=True)

          os.makedirs(os.path.dirname(OUTPUT), exist_ok=True)

          data = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "items": items
          }

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"총 {len(items)}개의 글을 최신순으로 저장했습니다.")
          PY

            - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blog/blog.json

          if git diff --cached --quiet; then
            echo "변경된 내용이 없습니다."
          else
            git commit -m "Update combined Naver blog posts"

            git pull --rebase origin main
            git push origin main
          fi

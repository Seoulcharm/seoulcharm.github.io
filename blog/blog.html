<div class="blog-container">
  <h2>서울참정형외과 최신 블로그 소식</h2>
  <p class="blog-subtext">서울참정형외과 네이버 블로그의 최신 소식을 확인하실 수 있습니다.</p>
  
  <!-- 글 목록이 로딩되어 들어갈 영역 -->
  <div id="blog-posts" class="blog-grid">
    <p class="loading">소식을 불러오는 중입니다...</p>
  </div>
</div>

<style>
  .blog-container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .blog-subtext {
    color: #666;
    margin-bottom: 30px;
  }
  .blog-grid {
    display: grid;
    /* 모바일에서는 2줄, PC에서는 더 많이 보이도록 반응형 조절 */
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 24px;
  }
  
  /* 반응형 추가: 모바일 등 작은 화면에서는 2줄로 고정하고 싶다면 아래 주석 제거 */
  /*
  @media (max-width: 600px) {
    .blog-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
  }
  */

  .blog-card {
    border: 1px solid #e1e1e1;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .blog-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  .blog-card a {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  
  /* [수정 포인트] 썸네일 이미지 영역을 정사각형(1:1)으로 고정 */
  .thumb-wrapper {
    width: 100%;
    /* aspect-ratio를 지원하는 최신 브라우저용 */
    aspect-ratio: 1 / 1; 
    overflow: hidden;
    background-color: #f5f5f5;
    position: relative;
  }
  
  /* aspect-ratio 미지원 구형 브라우저 꼼수 (필요시) */
  /*
  .thumb-wrapper::after {
    content: "";
    display: block;
    padding-bottom: 100%;
  }
  */

  .thumb-wrapper img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* 이미지가 정사각형 영역을 꽉 채우되 비율을 유지하며 잘림 */
    object-fit: cover; 
    transition: transform 0.3s;
  }
  
  .blog-card:hover .thumb-wrapper img {
    transform: scale(1.05);
  }
  
  /* 카드 본문 영역 스타일 */
  .card-content {
    padding: 15px; /* 정사각형 썸네일에 맞춰 패딩 약간 축소 */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-grow: 1;
  }
  
  .blog-card h3 {
    font-size: 1rem; /* 글자 크기 약간 축소 */
    margin: 0 0 8px 0;
    line-height: 1.4;
    color: #333;
    word-break: keep-all;
    /* 제목이 길 경우 2줄까지만 보여주고 말줄임표(...) 처리 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  
  .blog-date {
    font-size: 0.8rem;
    color: #888;
    margin-top: auto; /* 날짜를 항상 맨 아래로 */
    padding-top: 10px;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const blogJsonUrl = "{{ site.baseurl }}/blog/blog.json";
  const defaultImg = "{{ site.baseurl }}/img/logo.jpg";
  const container = document.getElementById("blog-posts");

  function formatDate(value) {
    if (!value) return "";

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";

    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }

  function getThumbnail(item) {
    if (item.thumbnail) return item.thumbnail;

    const description = item.description || "";
    const match = description.match(
      /<img\b[^>]*\bsrc=["']([^"']+)["']/i
    );

    return match
      ? match[1].replace(/&amp;/g, "&")
      : defaultImg;
  }

  fetch(blogJsonUrl + "?v=" + Date.now())
    .then(response => {
      if (!response.ok) {
        throw new Error("blog.json 오류: " + response.status);
      }
      return response.json();
    })
    .then(data => {
      const items = data.items || [];

      if (!items.length) {
        throw new Error("블로그 게시글이 없습니다.");
      }

      container.innerHTML = "";

      items.slice(0, 9).forEach(item => {
        const title = item.title || "제목 없음";
        const link = item.link || "https://blog.naver.com/seoulcharm1";
        const thumbnailUrl = getThumbnail(item);

        const card = document.createElement("div");
        card.className = "blog-card";

        const anchor = document.createElement("a");
        anchor.href = link;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";

        const thumbWrapper = document.createElement("div");
        thumbWrapper.className = "thumb-wrapper";

        const img = document.createElement("img");
        img.src = thumbnailUrl;
        img.alt = title;
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";

        img.onerror = function () {
          this.onerror = null;
          this.src = defaultImg;
        };

        thumbWrapper.appendChild(img);

        const content = document.createElement("div");
        content.className = "card-content";

        const heading = document.createElement("h3");
        heading.textContent = title;

        const date = document.createElement("div");
        date.className = "blog-date";
        date.textContent = formatDate(item.pubDate);

        content.appendChild(heading);
        content.appendChild(date);

        anchor.appendChild(thumbWrapper);
        anchor.appendChild(content);
        card.appendChild(anchor);
        container.appendChild(card);
      });
    })
    .catch(error => {
      console.error("블로그 JSON 불러오기 오류:", error);

      container.innerHTML = `
        <p>
          블로그 소식을 불러오지 못했습니다.
          <a href="https://blog.naver.com/seoulcharm1"
             target="_blank"
             rel="noopener noreferrer">
            서울참정형외과 네이버 블로그 바로가기
          </a>
        </p>
      `;
    });
});
</script>

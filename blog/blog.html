<div class="blog-container">
  <h2>서울참정형외과 최신 블로그 소식</h2>
  <p class="blog-subtext">서울참정형외과 네이버 블로그의 최신 소식을 확인하실 수 있습니다.</p>
  
  <!-- 글 목록이 로딩되어 들어갈 영역 -->
  <div id="blog-posts" class="blog-grid">
    <p class="loading">소식을 불러오는 중입니다...</p>
  </div>
</div>

<style>
  .blog-container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .blog-subtext {
    color: #666;
    margin-bottom: 30px;
  }
  .blog-grid {
    display: grid;
    /* 모바일에서는 2줄, PC에서는 더 많이 보이도록 반응형 조절 */
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 24px;
  }
  
  /* 반응형 추가: 모바일 등 작은 화면에서는 2줄로 고정하고 싶다면 아래 주석 제거 */
  /*
  @media (max-width: 600px) {
    .blog-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
  }
  */

  .blog-card {
    border: 1px solid #e1e1e1;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .blog-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  .blog-card a {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  
  /* [수정 포인트] 썸네일 이미지 영역을 정사각형(1:1)으로 고정 */
  .thumb-wrapper {
    width: 100%;
    /* aspect-ratio를 지원하는 최신 브라우저용 */
    aspect-ratio: 1 / 1; 
    overflow: hidden;
    background-color: #f5f5f5;
    position: relative;
  }
  
  /* aspect-ratio 미지원 구형 브라우저 꼼수 (필요시) */
  /*
  .thumb-wrapper::after {
    content: "";
    display: block;
    padding-bottom: 100%;
  }
  */

  .thumb-wrapper img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* 이미지가 정사각형 영역을 꽉 채우되 비율을 유지하며 잘림 */
    object-fit: cover; 
    transition: transform 0.3s;
  }
  
  .blog-card:hover .thumb-wrapper img {
    transform: scale(1.05);
  }
  
  /* 카드 본문 영역 스타일 */
  .card-content {
    padding: 15px; /* 정사각형 썸네일에 맞춰 패딩 약간 축소 */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-grow: 1;
  }
  
  .blog-card h3 {
    font-size: 1rem; /* 글자 크기 약간 축소 */
    margin: 0 0 8px 0;
    line-height: 1.4;
    color: #333;
    word-break: keep-all;
    /* 제목이 길 경우 2줄까지만 보여주고 말줄임표(...) 처리 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  
  .blog-date {
    font-size: 0.8rem;
    color: #888;
    margin-top: auto; /* 날짜를 항상 맨 아래로 */
    padding-top: 10px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const rssUrl = encodeURIComponent('https://rss.blog.naver.com/seoulcharm1.xml');
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

    // 이미지 없을 때 보여줄 기본 이미지 (병원 로고)
    // 경로가 맞는지 확인 필요 (Jekyll baseurl 포함)
    const defaultImg = '{{ site.baseurl }}/img/logo.jpg';

    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('blog-posts');
        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = ''; 

          data.items.slice(0, 9).forEach(item => {
            const card = document.createElement('div');
            card.className = 'blog-card';
            
            // 날짜 변환 (YYYY-MM-DD)
            const pubDate = new Date(item.pubDate).toLocaleDateString('ko-KR', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            }).replace(/\. /g, '-').replace(/\./g, '');

            // 1. rss2json이 파싱해준 thumbnail / enclosure 확인
            let thumbnailUrl = item.thumbnail || (item.enclosure && item.enclosure.link) || '';

            // 2. description(본문 HTML)에서 이미지 추출
            const content = item.description || item.content || '';

            if (!thumbnailUrl && content) {
              const imgMatch = content.match(/src=["'](https?:\/\/[^"']+\.(?:jpg|jpeg|png|gif)[^"']*)["']/i) ||
                               content.match(/src=["'](https?:\/\/[^"']+)["']/i);
              if (imgMatch && imgMatch[1]) {
                thumbnailUrl = imgMatch[1];
              }
            }

            // URL 디코딩 및 예외 처리
            if (thumbnailUrl) {
              thumbnailUrl = thumbnailUrl.replace(/&amp;/g, '&');
            } else {
              thumbnailUrl = defaultImg;
            }

            // [수정 포인트] target="_blank" 제거 (현재 창 이동)
            // 썸네일과 제목/날짜를 아우르는 카드 전체를 클릭 가능하도록 <a>로 감쌈
            card.innerHTML = `
              <a href="${item.link}">
                <div class="thumb-wrapper">
                  <img src="${thumbnailUrl}" 
                       alt="${item.title}" 
                       referrerpolicy="no-referrer" 
                       onerror="this.onerror=null; this.src='${defaultImg}';" />
                </div>
                <div class="card-content">
                  <h3>${item.title}</h3>
                  <div class="blog-date">${pubDate}</div>
                </div>
              </a>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<p>최신 글을 불러올 수 없습니다.</p>';
        }
      })
      .catch(error => {
        console.error('Error fetching blog RSS:', error);
        document.getElementById('blog-posts').innerHTML = '<p>블로그 소식을 불러오는 중 오류가 발생했습니다.</p>';
      });
  });
</script>

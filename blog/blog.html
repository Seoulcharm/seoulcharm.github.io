---
layout: default
title: 블로그 소식
---

<div class="blog-container">
  <h2>서울참정형외과 최신 블로그 소식</h2>
  <p class="blog-subtext">네이버 블로그의 최신 소식을 확인하실 수 있습니다.</p>
  
  <!-- 글 목록이 로딩되어 들어갈 영역 -->
  <div id="blog-posts" class="blog-grid">
    <p class="loading">소식을 불러오는 중입니다...</p>
  </div>
</div>

<style>
  .blog-container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .blog-subtext {
    color: #666;
    margin-bottom: 30px;
  }
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }
  .blog-card {
    border: 1px solid #e1e1e1;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .blog-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  .blog-card a {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  /* 썸네일 영역 스타일 */
  .thumb-wrapper {
    width: 100%;
    height: 180px;
    overflow: hidden;
    background-color: #f5f5f5;
  }
  .thumb-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
  }
  .blog-card:hover .thumb-wrapper img {
    transform: scale(1.05);
  }
  /* 카드 본문 영역 스타일 */
  .card-content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-grow: 1;
  }
  .blog-card h3 {
    font-size: 1.05rem;
    margin: 0 0 10px 0;
    line-height: 1.4;
    color: #333;
    word-break: keep-all;
  }
  .blog-date {
    font-size: 0.85rem;
    color: #888;
    margin-top: 15px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const rssUrl = encodeURIComponent('https://rss.blog.naver.com/seoulcharm1.xml');
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

    // 이미지 없을 때 보여줄 기본 이미지 (병원 로고나 기본 이미지 경로로 수정 가능)
    const defaultImg = '{{ site.baseurl }}/img/logo.jpg';

    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('blog-posts');
        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = ''; 

          data.items.slice(0, 9).forEach(item => {
            const card = document.createElement('div');
            card.className = 'blog-card';
            
            // 날짜 변환 (YYYY-MM-DD)
            const pubDate = new Date(item.pubDate).toLocaleDateString('ko-KR');

            // RSS 본문(description 또는 content)에서 첫 번째 img 태그 추출
            let thumbnailUrl = '';
            const content = item.description || item.content || '';
            const imgMatch = content.match(/<img[^>]+src=["']([^"']+)["']/i);

            if (item.thumbnail) {
              thumbnailUrl = item.thumbnail;
            } else if (imgMatch && imgMatch[1]) {
              thumbnailUrl = imgMatch[1];
            } else {
              thumbnailUrl = defaultImg;
            }

            // 카드 전체를 클릭 가능하도록 구성
            card.innerHTML = `
              <a href="${item.link}">
                <div class="thumb-wrapper">
                  <img src="${thumbnailUrl}" alt="${item.title}" onerror="this.src='${defaultImg}'" />
                </div>
                <div class="card-content">
                  <h3>${item.title}</h3>
                  <div class="blog-date">${pubDate}</div>
                </div>
              </a>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<p>최신 글을 불러올 수 없습니다.</p>';
        }
      })
      .catch(error => {
        console.error('Error fetching blog RSS:', error);
        document.getElementById('blog-posts').innerHTML = '<p>블로그 소식을 불러오는 중 오류가 발생했습니다.</p>';
      });
  });
</script>

<div class="blog-container">
  <h2>서울참정형외과 최신 블로그 소식</h2>
  <p class="blog-subtext">서울참정형외과 네이버 블로그의 최신 소식을 확인하실 수 있습니다.</p>
  
  <!-- 글 목록이 로딩되어 들어갈 영역 -->
  <div id="blog-posts" class="blog-grid">
    <p class="loading">소식을 불러오는 중입니다...</p>
  </div>
</div>

<style>
  .blog-container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .blog-subtext {
    color: #666;
    margin-bottom: 30px;
  }
  .blog-grid {
    display: grid;
    /* 모바일에서는 2줄, PC에서는 더 많이 보이도록 반응형 조절 */
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 24px;
  }
  
  /* 반응형 추가: 모바일 등 작은 화면에서는 2줄로 고정하고 싶다면 아래 주석 제거 */
  /*
  @media (max-width: 600px) {
    .blog-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
  }
  */

  .blog-card {
    border: 1px solid #e1e1e1;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .blog-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  .blog-card a {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  
  /* [수정 포인트] 썸네일 이미지 영역을 정사각형(1:1)으로 고정 */
  .thumb-wrapper {
    width: 100%;
    /* aspect-ratio를 지원하는 최신 브라우저용 */
    aspect-ratio: 1 / 1; 
    overflow: hidden;
    background-color: #f5f5f5;
    position: relative;
  }
  
  /* aspect-ratio 미지원 구형 브라우저 꼼수 (필요시) */
  /*
  .thumb-wrapper::after {
    content: "";
    display: block;
    padding-bottom: 100%;
  }
  */

  .thumb-wrapper img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* 이미지가 정사각형 영역을 꽉 채우되 비율을 유지하며 잘림 */
    object-fit: cover; 
    transition: transform 0.3s;
  }
  
  .blog-card:hover .thumb-wrapper img {
    transform: scale(1.05);
  }
  
  /* 카드 본문 영역 스타일 */
  .card-content {
    padding: 15px; /* 정사각형 썸네일에 맞춰 패딩 약간 축소 */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-grow: 1;
  }
  
  .blog-card h3 {
    font-size: 1rem; /* 글자 크기 약간 축소 */
    margin: 0 0 8px 0;
    line-height: 1.4;
    color: #333;
    word-break: keep-all;
    /* 제목이 길 경우 2줄까지만 보여주고 말줄임표(...) 처리 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  
  .blog-date {
    font-size: 0.8rem;
    color: #888;
    margin-top: auto; /* 날짜를 항상 맨 아래로 */
    padding-top: 10px;
  }
</style>

<script>
 
document.addEventListener("DOMContentLoaded", function () {
  const rssUrl = "https://rss.blog.naver.com/seoulcharm1.xml";
  const apiUrl =
    `https://rssjson.vercel.app/api?url=${encodeURIComponent(rssUrl)}`;

  const defaultImg = '{{ site.baseurl }}/img/logo.jpg';
  const container = document.getElementById("blog-posts");

  // 대체 서비스는 각 항목을 배열 형태로 반환하므로
  // 첫 번째 값을 안전하게 가져옵니다.
  function getValue(value) {
    if (Array.isArray(value)) return value[0] || "";
    return value || "";
  }

  fetch(apiUrl)
    .then(response => {
      if (!response.ok) {
        throw new Error(`RSS API 오류: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      const channel = data?.rss?.channel?.[0];
      const items = channel?.item || [];

      if (!items.length) {
        throw new Error("RSS 게시글이 없습니다.");
      }

      container.innerHTML = "";

      items.slice(0, 9).forEach(item => {
        const title = getValue(item.title);
        const link = getValue(item.link);
        const description = getValue(item.description);
        const pubDate = getValue(item.pubDate);

        // 게시글 본문에서 첫 번째 이미지 주소를 추출합니다.
        const imgMatch = description.match(
          /<img\b[^>]*\bsrc=["']([^"']+)["']/i
        );

        const thumbnailUrl = imgMatch
          ? imgMatch[1].replace(/&amp;/g, "&")
          : defaultImg;

        // 날짜를 YYYY-MM-DD 형식으로 표시합니다.
        const parsedDate = new Date(pubDate);
        const formattedDate = Number.isNaN(parsedDate.getTime())
          ? ""
          : [
              parsedDate.getFullYear(),
              String(parsedDate.getMonth() + 1).padStart(2, "0"),
              String(parsedDate.getDate()).padStart(2, "0")
            ].join("-");

        const card = document.createElement("div");
        card.className = "blog-card";

        const anchor = document.createElement("a");
        anchor.href = link;

        const thumbWrapper = document.createElement("div");
        thumbWrapper.className = "thumb-wrapper";

        const img = document.createElement("img");
        img.src = thumbnailUrl;
        img.alt = title;
        img.referrerPolicy = "no-referrer";
        img.onerror = function () {
          this.onerror = null;
          this.src = defaultImg;
        };

        thumbWrapper.appendChild(img);

        const content = document.createElement("div");
        content.className = "card-content";

        const heading = document.createElement("h3");
        heading.textContent = title;

        const date = document.createElement("div");
        date.className = "blog-date";
        date.textContent = formattedDate;

        content.appendChild(heading);
        content.appendChild(date);
        anchor.appendChild(thumbWrapper);
        anchor.appendChild(content);
        card.appendChild(anchor);
        container.appendChild(card);
      });
    })
    .catch(error => {
      console.error("블로그 RSS 불러오기 오류:", error);
      container.innerHTML =
        "<p>블로그 소식을 불러오는 중 오류가 발생했습니다.</p>";
    });
});

</script>

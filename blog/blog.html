---
layout: default
title: 블로그 소식
---

<div class="blog-container">
  <h2>서울참정형외과 최신 블로그 소식</h2>
  <p class="blog-subtext">네이버 블로그의 최신 소식을 확인하실 수 있습니다.</p>
  
  <!-- 글 목록이 로딩되어 들어갈 영역 -->
  <div id="blog-posts" class="blog-grid">
    <p class="loading">소식을 불러오는 중입니다...</p>
  </div>
</div>

<style>
  .blog-container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .blog-subtext {
    color: #666;
    margin-bottom: 30px;
  }
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .blog-card {
    border: 1px solid #e1e1e1;
    border-radius: 8px;
    padding: 20px;
    background: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .blog-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
  }
  .blog-card h3 {
    font-size: 1.1rem;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .blog-card h3 a {
    color: #333;
    text-decoration: none;
  }
  .blog-card h3 a:hover {
    color: #0056b3;
  }
  .blog-date {
    font-size: 0.85rem;
    color: #888;
    margin-top: 15px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // rss2json 무료 API를 이용해 네이버 RSS를 JSON 형태로 변환
    const rssUrl = encodeURIComponent('https://rss.blog.naver.com/seoulcharm1.xml');
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('blog-posts');
        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = ''; // 로딩 문구 제거

          data.items.slice(0, 9).forEach(item => { // 최신글 9개 표시
            const card = document.createElement('div');
            card.className = 'blog-card';
            
            // 날짜 포맷 변환 (YYYY-MM-DD)
            const pubDate = new Date(item.pubDate).toLocaleDateString('ko-KR');

            card.innerHTML = `
              <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
              <div class="blog-date">${pubDate}</div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<p>최신 글을 불러올 수 없습니다.</p>';
        }
      })
      .catch(error => {
        console.error('Error fetching blog RSS:', error);
        document.getElementById('blog-posts').innerHTML = '<p>블로그 소식을 불러오는 중 오류가 발생했습니다.</p>';
      });
  });
</script>
